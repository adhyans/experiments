<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wifi-live</title>
<style>
  :root {
    --bg: #05070d;
    --ink: #e8eef7;
    --dim: #6b7a90;
    --data: #35e0d0;
    --mgmt: #8b7cff;
    --ctrl: #f0a83c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    overflow: hidden;
  }
  canvas { display: block; width: 100vw; height: 100vh; }

  .hud {
    position: fixed;
    padding: 14px 16px;
    pointer-events: none;
    text-transform: lowercase;
    letter-spacing: 0.04em;
  }
  .hud.tl { top: 0; left: 0; }
  .hud.tr { top: 0; right: 0; text-align: right; }
  .hud.bl { bottom: 0; left: 0; }

  h1 {
    margin: 0 0 2px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  .sub { color: var(--dim); }

  .stat { font-variant-numeric: tabular-nums; }
  .stat b { font-weight: 600; font-size: 20px; letter-spacing: -0.01em; }

  .legend { display: flex; gap: 14px; margin-top: 8px; }
  .legend i {
    display: inline-block; width: 7px; height: 7px;
    border-radius: 50%; margin-right: 5px; font-style: normal;
    vertical-align: middle;
  }
  .k-data i { background: var(--data); box-shadow: 0 0 8px var(--data); }
  .k-mgmt i { background: var(--mgmt); box-shadow: 0 0 8px var(--mgmt); }
  .k-ctrl i { background: var(--ctrl); box-shadow: 0 0 8px var(--ctrl); }

  #status { color: var(--ctrl); }
  #status.ok { color: var(--dim); }
</style>
</head>
<body>
  <canvas id="c"></canvas>

  <div class="hud tl">
    <h1>wifi&#8202;&middot;&#8202;live</h1>
    <div class="sub">every dot is one 802.11 frame that hit the antenna</div>
    <div class="legend">
      <span class="k-data"><i></i>data</span>
      <span class="k-mgmt"><i></i>management</span>
      <span class="k-ctrl"><i></i>control</span>
    </div>
  </div>

  <div class="hud tr">
    <div class="stat"><b id="pps">0</b> frames/sec</div>
    <div class="stat sub"><span id="devices">0</span> transmitters &middot; <span id="total">0</span> total</div>
    <div class="sub" id="status">connecting</div>
  </div>

  <div class="hud bl sub">
    distance from centre = signal strength &middot; centre = your board
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
